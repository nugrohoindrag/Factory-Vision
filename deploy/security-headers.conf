# Security response headers for the static front ends (§29).
#
# Included rather than written once at server level because nginx's add_header
# does not merge: a location that adds its own header drops every header
# inherited from above. The cache-control locations below would otherwise serve
# the app bundle with no CSP at all, which is the half of the site that runs
# code.
#
# `always` so the headers survive error responses too — a 404 from the SPA
# fallback is still a page in a browser.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Ignored by browsers over plain HTTP, so a plant LAN on http:// is unaffected
# while a public deployment behind Traefik gets the guarantee.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# The bundle is served from this origin and talks to the API on this origin,
# so everything is 'self'. Two exceptions, both real:
#
#   style-src 'unsafe-inline'  the apps style through React `style` props
#   ws: wss:                   the realtime board channel
#
# Tokens live in browser storage rather than cookies, which makes this policy
# the control that keeps a script injection from turning into a stolen session.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
