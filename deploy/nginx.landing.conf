# Static hosting for the public landing page.
#
# Differs from nginx.conf (console / operator / admin) in two ways: the
# security headers admit Google Analytics and Google Fonts, and the CMS pages
# the API renders (/blog, sitemap, robots, Search Console verification) are
# proxied so they are served from the site's own origin, which is what a
# crawler and Search Console need.

server {
 listen 80;
 server_name _;

 root /usr/share/nginx/html;
 index index.html;

 include /etc/nginx/security-headers.conf;
 server_tokens off;

 # Client-side routing: every unknown path is an app route, not a 404.
 location / {
 try_files $uri $uri/ /index.html;
 }

 # The trial form and the demo request go to the API on the same origin.
 location /api/ {
 proxy_pass http://api:4000;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_read_timeout 60s;
 }

 # CMS: site config for the bundle, the analytics bootstrap, and the pages
 # the API renders as HTML. Search Console's HTML-file verification is a
 # googleXXXX.html at the root; the API answers only the configured name.
 location ~ ^/(site/|blog(/|$)|sitemap\.xml$|robots\.txt$|google[0-9a-f]+\.html$) {
 proxy_pass http://api:4000;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_read_timeout 30s;
 }

 location ~* \.(js|css|woff2?|png|jpg|svg)$ {
 expires 1y;
 include /etc/nginx/security-headers.conf;
 add_header Cache-Control "public, immutable";
 }

 # index.html carries an SSI directive that pulls /site/head.html from the
 # API: the Search Console meta tag and the analytics tag land in the raw
 # HTML, which is what Google's verification crawler reads (it runs no
 # script). The include is a subrequest to the proxied location above.
 location = /index.html {
 ssi on;
 ssi_types text/html;
 include /etc/nginx/security-headers.conf;
 add_header Cache-Control "no-store";
 }
}
