# Static hosting for the console and the operator PWA.
#
# The API is reached at the compose service name `api`, so the same image runs
# in a cloud deployment and on a factory's own network without a rebuild. Point
# it elsewhere by mounting a replacement for this file.

server {
 listen 80;
 server_name _;

 root /usr/share/nginx/html;
 index index.html;

 # Client-side routing: every unknown path is an app route, not a 404.
 location / {
 try_files $uri $uri/ /index.html;
 }

 # The API is proxied rather than called cross-origin, so the operator PWA
 # keeps working from a single origin on a factory LAN with no CORS setup.
 location /api/ {
 proxy_pass http://api:4000;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_read_timeout 60s;
 }

 # Realtime board updates.
 location /socket.io/ {
 proxy_pass http://api:4000;
 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "upgrade";
 proxy_set_header Host $host;
 proxy_read_timeout 3600s;
 }

 # Hashed assets are immutable; index.html must never be cached or a tablet
 # will keep running last week's bundle after an update.
 location ~* \.(js|css|woff2?|png|jpg|svg)$ {
 expires 1y;
 add_header Cache-Control "public, immutable";
 }

 location = /index.html {
 add_header Cache-Control "no-store";
 }

 gzip on;
 gzip_types text/plain text/css application/json application/javascript image/svg+xml;
 gzip_min_length 1024;
}
