# Static hosting for the console and the operator PWA.
#
# The API is reached at the compose service name `api`, so the same image runs
# in a cloud deployment and on a factory's own network without a rebuild. Point
# it elsewhere by mounting a replacement for this file.

server {
 listen 80;
 server_name _;

 root /usr/share/nginx/html;
 index index.html;

 # Resolve `api` per request through Docker's embedded DNS instead of once at
 # startup. A static proxy_pass pins the address the api container had when
 # nginx started; once api is recreated (any deploy that touches it) the address
 # is stale and every /api/ call answers 502 until this container is restarted.
 resolver 127.0.0.11 valid=10s ipv6=off;
 set $api_upstream http://api:4000;

 # Security headers (§29). Repeated inside the locations that set their own
 # add_header, because nginx replaces rather than merges.
 include /etc/nginx/security-headers.conf;

 # An attacker learns the exact nginx build from the default banner.
 server_tokens off;

 # Client-side routing: every unknown path is an app route, not a 404.
 location / {
 try_files $uri $uri/ /index.html;
 }

 # The API is proxied rather than called cross-origin, so the operator PWA
 # keeps working from a single origin on a factory LAN with no CORS setup.
 location /api/ {
 proxy_pass $api_upstream;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_read_timeout 60s;
 }

 # Realtime board updates.
 location /socket.io/ {
 proxy_pass $api_upstream;
 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "upgrade";
 proxy_set_header Host $host;
 proxy_read_timeout 3600s;
 }

 # Hashed assets are immutable; index.html must never be cached or a tablet
 # will keep running last week's bundle after an update.
 location ~* \.(js|css|woff2?|png|jpg|svg)$ {
 expires 1y;
 include /etc/nginx/security-headers.conf;
 add_header Cache-Control "public, immutable";
 }

 location = /index.html {
 include /etc/nginx/security-headers.conf;
 add_header Cache-Control "no-store";
 }

 gzip on;
 gzip_types text/plain text/css application/json application/javascript image/svg+xml;
 gzip_min_length 1024;
}
