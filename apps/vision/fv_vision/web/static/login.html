<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk · CV Vision</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
</head>
<body>
  <div class="login-wrap">
    <form class="card login" id="form" autocomplete="on">
      <h1>CV Vision</h1>
      <p>Pemantauan kerumunan dan lalu lintas · Factory Vision</p>
      <label for="username">Nama pengguna</label>
      <input class="control" id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Kata sandi</label>
      <input class="control" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit" id="submit">Masuk</button>
      <div class="error" id="error" role="alert"></div>
    </form>
  </div>
  <script src="/static/login.js"></script>
</body>
</html>
