name: CI

# Trunk is `master`; `staging` and `production` are promotion branches. Every
# push and every pull request is verified, but only a push to one of the three
# long-lived branches (or a `v*` tag) publishes images, and only after `verify`
# is green — that ordering is the point of `needs:` below.
on:
  push:
    branches: [master, staging, production]
    tags: ['v*']
  pull_request:
    branches: [master, staging, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Typecheck, build, acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No version pinned here on purpose: pnpm/action-setup reads the
      # `packageManager` field in package.json, so the runner and a developer's
      # machine cannot drift apart.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # `pnpm ds:check` is deliberately absent: it diffs packages/ui/src
      # against the upstream design system at a local path (D:\Design System),
      # which no runner has. It stays a pre-commit check on a workstation.

      - name: Start API
        env:
          PORT: '4000'
          SEED_DEMO_DATA: 'true'
          AUTH_REQUIRED: 'true'
          # Throwaway values for this job only. The acceptance script signs in
          # with them; nothing here is a real credential.
          BOOTSTRAP_ADMIN_EMAIL: admin@pabrik.co.id
          BOOTSTRAP_ADMIN_PASSWORD: RahasiaKuat2026
          BOOTSTRAP_OPERATOR_PIN: '1234'
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/health > /dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy:" && cat api.log && exit 1

      - name: Acceptance (54 user stories)
        env:
          API_BASE: http://localhost:4000
          BOOTSTRAP_ADMIN_EMAIL: admin@pabrik.co.id
          BOOTSTRAP_ADMIN_PASSWORD: RahasiaKuat2026
          BOOTSTRAP_OPERATOR_PIN: '1234'
        run: node scripts/verify-user-stories.mjs

      - name: API log on failure
        if: failure()
        run: cat api.log || true

      - name: Stop API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

  publish:
    name: Publish images
    needs: verify
    # Pull requests verify but never publish: the head of a PR is not a
    # release, and a fork's token could not push to the registry anyway.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: factory-vision-api
            dockerfile: deploy/Dockerfile.api
            app: ''
          - image: factory-vision-console
            dockerfile: deploy/Dockerfile.web
            app: console
          - image: factory-vision-operator
            dockerfile: deploy/Dockerfile.web
            app: operator
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Spelled out rather than derived from github.repository, which
          # carries capitals ("Factory-Vision") that GHCR rejects.
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this, buildx attaches a provenance manifest that GHCR lists
          # as a second "unknown/unknown" architecture beside the real image.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
