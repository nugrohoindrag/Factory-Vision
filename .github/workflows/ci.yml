name: CI

# Trunk is `master`; `staging` and `production` are promotion branches. Every
# push and every pull request is verified, but only a push to one of the three
# long-lived branches (or a `v*` tag) publishes images, and only after `verify`
# is green — that ordering is the point of `needs:` below.
on:
  push:
    branches: [master, staging, production]
    tags: ['v*']
  pull_request:
    branches: [master, staging, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Corepack must never stop to ask whether it may fetch the pinned pnpm.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  verify:
    name: Build, typecheck, acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_vision
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U factory -d factory_vision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Corepack rather than pnpm/action-setup: the version comes from the
      # `packageManager` field, so the runner cannot drift from a developer's
      # machine or from deploy/Dockerfile.*, which bootstrap pnpm the same way.
      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first, not second. Every package resolves its workspace
      # dependencies through `exports.types` -> `dist/index.d.ts`, so on a
      # clean checkout `pnpm typecheck` cannot see @factory-vision/domain-types
      # until something has emitted it. It only passed on a developer's machine
      # because a previous build had left dist/ behind.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm ds:check` is deliberately absent: it diffs packages/ui/src
      # against the upstream design system at a local path (D:\Design System),
      # which no runner has. It stays a pre-commit check on a workstation.

      - name: Migrate
        env:
          DATABASE_URL: postgresql://factory:factory@localhost:5432/factory_vision
          APP_DB_PASSWORD: ci-app-role-password
        run: pnpm db:migrate

      # The deployed stack applies migrations and seeds in one step, so CI has
      # to as well. Without this the acceptance run met a schema with no tenant,
      # no master data and no production plan, and every story that needs a Work
      # Order failed on a database that a real install never has.
      - name: Seed
        env:
          DATABASE_URL: postgresql://factory:factory@localhost:5432/factory_vision
        run: pnpm db:seed

      - name: Start API
        env:
          PORT: '4000'
          # The RLS-bound role, never the schema owner.
          DATABASE_URL: postgresql://factory_app:ci-app-role-password@localhost:5432/factory_vision
          SEED_DEMO_DATA: 'true'
          AUTH_REQUIRED: 'true'
          # Throwaway values for this job only. The acceptance script signs in
          # with them; nothing here is a real credential.
          BOOTSTRAP_ADMIN_EMAIL: admin@pabrik.co.id
          BOOTSTRAP_ADMIN_PASSWORD: RahasiaKuat2026
          BOOTSTRAP_OPERATOR_PIN: '1234'
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/health > /dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy:" && cat api.log && exit 1

      - name: Acceptance (54 user stories)
        env:
          API_BASE: http://localhost:4000
          BOOTSTRAP_ADMIN_EMAIL: admin@pabrik.co.id
          BOOTSTRAP_ADMIN_PASSWORD: RahasiaKuat2026
          BOOTSTRAP_OPERATOR_PIN: '1234'
        run: node scripts/verify-user-stories.mjs

      - name: API log on failure
        if: failure()
        run: cat api.log || true

      - name: Stop API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

  persistence:
    name: Migrations, isolation & persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_vision
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U factory -d factory_vision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Migrations run as the schema owner. This is also the regression test
      # for the runner itself, which used to catch a failed migration, log it
      # and exit 0.
      - name: Migrate
        env:
          DATABASE_URL: postgresql://factory:factory@localhost:5432/factory_vision
          APP_DB_PASSWORD: ci-app-role-password
        run: pnpm db:migrate

      # The application role, not the owner: connecting as the superuser is
      # exactly the defect this job exists to catch, and the first check in the
      # script asserts the role is one the policies bind.
      - name: Tenant isolation
        env:
          OWNER_DATABASE_URL: postgresql://factory:factory@localhost:5432/factory_vision
          DATABASE_URL: postgresql://factory_app:ci-app-role-password@localhost:5432/factory_vision
        run: pnpm verify:isolation

      # P0 — production data persistence. This one starts the API, writes
      # through it, kills it, starts it again and reads back, so it fails if
      # anything the shop floor captures is ever held in process memory alone.
      - name: Production data persistence
        env:
          OWNER_DATABASE_URL: postgresql://factory:factory@localhost:5432/factory_vision
          DATABASE_URL: postgresql://factory_app:ci-app-role-password@localhost:5432/factory_vision
        run: pnpm verify:persistence

  publish:
    name: Publish images
    needs: [verify, persistence]
    # Pull requests verify but never publish: the head of a PR is not a
    # release, and a fork's token could not push to the registry anyway.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: factory-vision-api
            dockerfile: deploy/Dockerfile.api
            app: ''
          - image: factory-vision-console
            dockerfile: deploy/Dockerfile.web
            app: console
          - image: factory-vision-operator
            dockerfile: deploy/Dockerfile.web
            app: operator
          - image: factory-vision-admin
            dockerfile: deploy/Dockerfile.web
            app: admin
          - image: factory-vision-worker
            dockerfile: deploy/Dockerfile.worker
            app: ''
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Spelled out rather than derived from github.repository, which
          # carries capitals ("Factory-Vision") that GHCR rejects.
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this, buildx attaches a provenance manifest that GHCR lists
          # as a second "unknown/unknown" architecture beside the real image.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
