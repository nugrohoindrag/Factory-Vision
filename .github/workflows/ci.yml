name: CI

# Trunk is `master`; `staging` and `production` are promotion branches. Every
# push and every pull request is verified, but only a push to one of the three
# long-lived branches (or a `v*` tag) publishes images, and only after `verify`
# is green — that ordering is the point of `needs:` below.
on:
  push:
    branches: [master, staging, production]
    tags: ['v*']
  pull_request:
    branches: [master, staging, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Corepack must never stop to ask whether it may fetch the pinned pnpm.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  verify:
    name: Build, typecheck, acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_vision
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U factory -d factory_vision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Corepack rather than pnpm/action-setup: the version comes from the
      # `packageManager` field, so the runner cannot drift from a developer's
      # machine or from deploy/Dockerfile.*, which bootstrap pnpm the same way.
      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first, not second. Every package resolves its workspace
      # dependencies through `exports.types` -> `dist/index.d.ts`, so on a
      # clean checkout `pnpm typecheck` cannot see @factory-vision/domain-types
      # until something has emitted it. It only passed on a developer's machine
      # because a previous build had left dist/ behind.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm ds:check` is deliberately absent: it diffs packages/ui/src
      # against the upstream design system at a local path (D:\Design System),
      # which no runner has. It stays a pre-commit check on a workstation.

      # The icon font is a subset generated from the source. An icon named
      # after the last generation has no glyph and renders as its own name,
      # in the icon's size and colour, overflowing the sidebar. Nothing in
      # the build notices; this does. Needs only fontTools, so it runs here.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Icon font covers every referenced icon
        run: |
          pip install --quiet fonttools brotli
          pnpm fonts:check

      - name: Migrate
        env:
          DATABASE_URL: postgresql://factory:factory@localhost:5432/factory_vision
          APP_DB_PASSWORD: ci-app-role-password
        run: pnpm db:migrate

      # The deployed stack applies migrations and seeds in one step, so CI has
      # to as well. Without this the acceptance run met a schema with no tenant,
      # no master data and no production plan, and every story that needs a Work
      # Order failed on a database that a real install never has.
      - name: Seed
        env:
          DATABASE_URL: postgresql://factory:factory@localhost:5432/factory_vision
        run: pnpm db:seed

      - name: Start API
        env:
          PORT: '4000'
          # The RLS-bound role, never the schema owner.
          DATABASE_URL: postgresql://factory_app:ci-app-role-password@localhost:5432/factory_vision
          SEED_DEMO_DATA: 'true'
          AUTH_REQUIRED: 'true'
          # Throwaway values for this job only. The acceptance script signs in
          # with them; nothing here is a real credential.
          BOOTSTRAP_ADMIN_EMAIL: admin@pabrik.co.id
          BOOTSTRAP_ADMIN_PASSWORD: RahasiaKuat2026
          BOOTSTRAP_OPERATOR_PIN: '284617'
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/health > /dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy:" && cat api.log && exit 1

      - name: Unit tests (domain & security controls)
        run: pnpm --filter @factory-vision/api test

      - name: Security posture (Cyber Security Requirement, MUST controls)
        env:
          QA_API: http://localhost:4000
        run: node apps/api/scripts/qa-security-posture.mjs

      - name: Acceptance (54 user stories)
        env:
          API_BASE: http://localhost:4000
          BOOTSTRAP_ADMIN_EMAIL: admin@pabrik.co.id
          BOOTSTRAP_ADMIN_PASSWORD: RahasiaKuat2026
          BOOTSTRAP_OPERATOR_PIN: '284617'
        run: node scripts/verify-user-stories.mjs

      - name: API log on failure
        if: failure()
        run: cat api.log || true

      - name: Stop API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

  persistence:
    name: Migrations, isolation & persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_vision
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U factory -d factory_vision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Migrations run as the schema owner. This is also the regression test
      # for the runner itself, which used to catch a failed migration, log it
      # and exit 0.
      - name: Migrate
        env:
          DATABASE_URL: postgresql://factory:factory@localhost:5432/factory_vision
          APP_DB_PASSWORD: ci-app-role-password
        run: pnpm db:migrate

      # Same reason as in the acceptance job: the deployed stack migrates and
      # seeds together, and the persistence check writes production against a
      # Work Order that only the seed creates.
      - name: Seed
        env:
          DATABASE_URL: postgresql://factory:factory@localhost:5432/factory_vision
        run: pnpm db:seed

      # Every migration must survive being applied twice.
      #
      # The runner inside the API image keeps no `schema_migrations` table — a
      # pull-based host has no checkout to record state in — so it replays the
      # whole directory on every deploy. Nothing here could catch a violation
      # before: every job above migrates a database created seconds earlier, so
      # only the first application was ever exercised. Migration 022 shipped
      # two unguarded CREATE POLICY statements on that blind spot and broke the
      # first deployment that followed it, taking ten later migrations with it.
      #
      # Runs against its own throwaway database, which it creates and drops.
      - name: Migration replay guard
        env:
          DATABASE_URL: postgresql://factory:factory@localhost:5432/factory_vision
        run: pnpm db:replay-check

      # The application role, not the owner: connecting as the superuser is
      # exactly the defect this job exists to catch, and the first check in the
      # script asserts the role is one the policies bind.
      - name: Tenant isolation
        env:
          OWNER_DATABASE_URL: postgresql://factory:factory@localhost:5432/factory_vision
          DATABASE_URL: postgresql://factory_app:ci-app-role-password@localhost:5432/factory_vision
        run: pnpm verify:isolation

      # P0 — production data persistence. This one starts the API, writes
      # through it, kills it, starts it again and reads back, so it fails if
      # anything the shop floor captures is ever held in process memory alone.
      - name: Production data persistence
        env:
          OWNER_DATABASE_URL: postgresql://factory:factory@localhost:5432/factory_vision
          DATABASE_URL: postgresql://factory_app:ci-app-role-password@localhost:5432/factory_vision
        run: pnpm verify:persistence

      # MES Improvement acceptance (Improvement PRD §50). Eight end-to-end
      # scenarios — material, quality, maintenance, workforce, WIP, board,
      # events, offline — asserted through HTTP and then read back as the
      # database owner, so the API is never asked to vouch for itself.
      #
      # It belongs in this job rather than beside the 54 user stories because
      # it needs both connections: the application role to drive the API, and
      # the owner to read rows back through FORCE ROW LEVEL SECURITY. It runs
      # last because it starts and stops an API of its own on its own port.
      #
      # The release shipped without this step, which is how two regressions in
      # the v1.7 acceptance suite reached staging: the improvement's own gate
      # was something a person remembered to run, and the suite that would have
      # caught them was something CI ran. Both are CI's job now.
      - name: MES Improvement acceptance (PRD §50)
        env:
          OWNER_DATABASE_URL: postgresql://factory:factory@localhost:5432/factory_vision
          DATABASE_URL: postgresql://factory_app:ci-app-role-password@localhost:5432/factory_vision
        run: pnpm verify:improvement

  # The Go implementation of the API (apps/api-go), being built towards a
  # cutover milestone by milestone. Three gates: the Go suite (unit +
  # integration against the same PostgreSQL as `persistence`), the fixtures
  # exported from the TypeScript sources being current, and the black-box
  # scripts run against the Go binary alone. Thresholds below are the current
  # milestone's; each milestone raises them until every check passes.
  api-go:
    name: Go API (unit, integration, black-box gates)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_vision
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U factory -d factory_vision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: Asia/Jakarta
      OWNER_DATABASE_URL: postgresql://factory:factory@localhost:5432/factory_vision
      APP_DATABASE_URL: postgresql://factory_app:ci-app-role-password@localhost:5432/factory_vision
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      # The export imports the workspace packages through their built `dist`,
      # and the Node reference API started later needs the full build anyway.
      - name: Build workspace
        run: pnpm build > build.log 2>&1 || { cat build.log; exit 1; }

      # The permission catalogue, the role baselines and the route → permission
      # golden file are exported from the TypeScript sources. A stale export
      # means the Go tables are being checked against yesterday's policy.
      - name: Fixtures are current
        run: |
          node --import tsx apps/api/scripts/export-go-fixtures.mjs
          git diff --exit-code -- apps/api-go/fixtures || {
            echo "::error::apps/api-go/fixtures is stale; run: node --import tsx apps/api/scripts/export-go-fixtures.mjs"
            exit 1
          }

      - name: Vet, build, unit tests
        working-directory: apps/api-go
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt:"; gofmt -l .; exit 1; }
          go vet ./...
          go build -o bin/fv ./cmd/fv
          go test ./...

      - name: Migrate and seed
        env:
          DATABASE_URL: ${{ env.OWNER_DATABASE_URL }}
          APP_DB_PASSWORD: ci-app-role-password
        run: |
          pnpm db:migrate
          pnpm db:seed

      # Driven through the RLS-bound role, verified through the owner — the
      # same split verify-mes-improvement.mjs uses.
      - name: Integration tests
        working-directory: apps/api-go
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
        run: go test -tags integration ./...

      - name: Start Go API
        env:
          PORT: '4000'
          NODE_ENV: test
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          SEED_DEMO_DATA: 'true'
          AUTH_REQUIRED: 'true'
          # Throwaway values for this job only; nothing here is a real credential.
          BOOTSTRAP_ADMIN_EMAIL: admin@pabrik.co.id
          BOOTSTRAP_ADMIN_PASSWORD: RahasiaKuat2026
          BOOTSTRAP_OPERATOR_PIN: '284617'
          MFA_ENCRYPTION_KEY: ci-only-mfa-key
        run: |
          apps/api-go/bin/fv serve > api-go.log 2>&1 &
          echo $! > api-go.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health > /dev/null && exit 0
            sleep 1
          done
          echo "Go API did not become healthy:" && cat api-go.log && exit 1

      # Milestone thresholds. M1: the security posture passes except
      # trial-register (onboarding, M6); 34 of the 81 story assertions pass
      # (identity, users, roles, master data, shifts, CSV, audit, meta).
      - name: Security posture against Go
        env:
          QA_API: http://localhost:4000
        run: |
          # 2>&1: the script writes its FAIL lines and the summary of failing
          # checks to stderr, and the assertions below read both.
          node apps/api/scripts/qa-security-posture.mjs 2>&1 | tee posture.log || true
          grep -q "12 passed, 1 failed" posture.log
          grep -q "pendaftaran trial" posture.log

      - name: User stories against Go (milestone threshold)
        env:
          API_BASE: http://localhost:4000
          BOOTSTRAP_ADMIN_EMAIL: admin@pabrik.co.id
          BOOTSTRAP_ADMIN_PASSWORD: RahasiaKuat2026
          BOOTSTRAP_OPERATOR_PIN: '284617'
        run: |
          node scripts/verify-user-stories.mjs 2>&1 | tee stories.log || true
          passed=$(grep -oE '[0-9]+/81 assertions passed' stories.log | grep -oE '^[0-9]+')
          echo "passed=$passed (threshold 34)"
          test "${passed:-0}" -ge 34

      # The Node API on :4001, same database, for the differential contract
      # check over every ported GET route.
      - name: Start Node API (reference)
        env:
          PORT: '4001'
          NODE_ENV: test
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          SEED_DEMO_DATA: 'true'
          AUTH_REQUIRED: 'true'
          API_RUN_JOB_RUNNER: 'false'
          OUTBOX_RELAY_ENABLED: 'false'
          BOOTSTRAP_ADMIN_EMAIL: admin@pabrik.co.id
          BOOTSTRAP_ADMIN_PASSWORD: RahasiaKuat2026
          BOOTSTRAP_OPERATOR_PIN: '284617'
          MFA_ENCRYPTION_KEY: ci-only-mfa-key
        run: |
          node apps/api/dist/main.js > api-node.log 2>&1 &
          echo $! > api-node.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:4001/health > /dev/null && exit 0
            sleep 1
          done
          echo "Node API did not become healthy:" && cat api-node.log && exit 1

      - name: Differential contract check (Go vs Node)
        env:
          GO_API: http://localhost:4000
          NODE_API: http://localhost:4001
          BOOTSTRAP_ADMIN_EMAIL: admin@pabrik.co.id
          BOOTSTRAP_ADMIN_PASSWORD: RahasiaKuat2026
        run: |
          node scripts/qa-api-diff.mjs \
            --include=/api/v1/master,/api/v1/events,/api/v1/audit-logs,/api/v1/roles,/api/v1/permissions,/api/v1/shifts,/api/v1/csv,/api/v1/meta/deployment,/api/v1/sessions,/api/v1/security \
            --allow=/api/v1/csv/entities,/api/v1/master/batches,/api/v1/master/bom,/api/v1/master/devices,/api/v1/master/processes,/api/v1/shifts/handover,/api/v1/shifts/performance

      - name: Logs on failure
        if: failure()
        run: |
          echo "--- Go ---"; cat api-go.log || true
          echo "--- Node ---"; cat api-node.log || true

      - name: Stop APIs
        if: always()
        run: |
          kill "$(cat api-go.pid)" 2>/dev/null || true
          kill "$(cat api-node.pid)" 2>/dev/null || true

  # SAST for the Go implementation, in its own job so the TypeScript CodeQL
  # category and the Go one never share an analysis.
  scan-go:
    name: Static analysis (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-and-quality
      - name: Build
        working-directory: apps/api-go
        run: go build ./...
      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:go'

  # Security scanning (§47, §49, §50). Separate from `verify` so a scanner
  # being slow, or its feed being down, never blocks the acceptance signal —
  # and separate from `publish` so nothing reaches the registry unscanned.
  scan:
    name: Dependency, secret & static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Secret scanning needs history: a credential committed and then
          # removed is still a leaked credential, and the fix is rotation.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable

      # Known-vulnerable dependencies (§47).
      #
      # The blocking gate is the production dependency tree, because that is
      # what ships inside the images. Build tooling is reported but does not
      # fail the run: a Vite dev-server advisory is real for a developer's
      # laptop and irrelevant to a factory, where nginx serves a static
      # bundle and no dev server exists. Tracked exceptions live in
      # SECURITY-EXCEPTIONS.md with an owner and a review date.
      - name: Dependency audit (production tree, blocking)
        run: pnpm audit --prod --audit-level high

      - name: Dependency audit (full tree, reported)
        if: always()
        run: pnpm audit || true

      # Secrets that should never have been committed (§51).
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SAST. CodeQL rather than a bespoke ruleset: it is maintained, it
      # understands TypeScript, and its findings land in the repository's
      # security tab where they can be tracked rather than scrolled past.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  # Container image scanning (§48). Runs on the images this commit would
  # publish, built locally so a pull request is scanned too.
  scan-image:
    name: Container image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build API image
        run: docker build -f deploy/Dockerfile.api -t factory-vision-api:scan .

      # Pinned to a tag that exists: `0.28.0` was never published, and an
      # unresolvable action reference fails the job at "Set up job" — before a
      # single step runs, which reads as a broken runner rather than a typo.
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: factory-vision-api:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Go API image
        run: docker build -f deploy/Dockerfile.api-go -t factory-vision-api-go:scan .

      - name: Scan Go API image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: factory-vision-api-go:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  publish:
    name: Publish images
    needs: [verify, persistence, api-go, scan, scan-go, scan-image]
    # Pull requests verify but never publish: the head of a PR is not a
    # release, and a fork's token could not push to the registry anyway.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: factory-vision-api
            dockerfile: deploy/Dockerfile.api
            app: ''
          - image: factory-vision-api-go
            dockerfile: deploy/Dockerfile.api-go
            app: ''
          - image: factory-vision-console
            dockerfile: deploy/Dockerfile.web
            app: console
          - image: factory-vision-operator
            dockerfile: deploy/Dockerfile.web
            app: operator
          - image: factory-vision-landing
            dockerfile: deploy/Dockerfile.web
            app: landing
          - image: factory-vision-admin
            dockerfile: deploy/Dockerfile.web
            app: admin
          - image: factory-vision-worker
            dockerfile: deploy/Dockerfile.worker
            app: ''
          - image: factory-vision-backup
            dockerfile: deploy/Dockerfile.backup
            app: ''
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Spelled out rather than derived from github.repository, which
          # carries capitals ("Factory-Vision") that GHCR rejects.
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this, buildx attaches a provenance manifest that GHCR lists
          # as a second "unknown/unknown" architecture beside the real image.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Deploy to the production host after a push to `master` has published the
  # images that host tracks (deploy/.env there pins IMAGE_TAG=master).
  #
  # `master` is the last step of the promotion chain
  # (branch → staging → production → master), so by the time this runs the
  # same commit has already been through CI three times. The job does what
  # RUNBOOK-DEPLOY.md does, over SSH, via deploy/deploy.sh: dump, pull,
  # migrate, up, verify — and stops at the first failure without rolling back.
  #
  # It is inert until four repository secrets exist (RUNBOOK §9d):
  # DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS. Without them
  # it prints a notice and exits green, so a fork or a fresh clone is not
  # broken by a missing box. The `production` environment lets the repository
  # require a reviewer's approval before this job runs.
  deploy:
    name: Deploy to production host
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://dashboard.factoryvision.id
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy secrets present?
        id: check
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::DEPLOY_SSH_KEY / DEPLOY_HOST are not set. Images are published; the host was not touched. See deploy/RUNBOOK-DEPLOY.md §9d."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH
        if: steps.check.outputs.configured == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Trust on first use is weaker than a pinned key; say so.
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set; the host key is taken from ssh-keyscan on this run."
            ssh-keyscan -t ed25519,rsa "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      # `pull --ff-only` rather than `reset --hard`: a hot-fix committed on the
      # box makes this fail loudly instead of being discarded in silence.
      - name: Roll the stack forward
        if: steps.check.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          CHECKOUT: ${{ vars.DEPLOY_CHECKOUT || '/opt/factory-vision' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${DEPLOY_USER:-adminfv}@$HOST" \
            "sudo -n bash -c 'set -e; cd $CHECKOUT; \
              git -c safe.directory=$CHECKOUT fetch --quiet origin master; \
              git -c safe.directory=$CHECKOUT checkout --quiet master; \
              git -c safe.directory=$CHECKOUT pull --ff-only --quiet origin master; \
              echo \"[deploy] checkout at \$(git -c safe.directory=$CHECKOUT rev-parse --short HEAD)\"; \
              sh deploy/deploy.sh'"
