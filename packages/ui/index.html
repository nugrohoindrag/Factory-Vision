<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morphic Design System</title>
    <!-- §6 Typography — Roboto Flex for M3 fidelity, Inter as the alternative -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;450;500;550;600;620;650;680;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- §28 Iconography — Material Symbols Rounded is the single icon family -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
      /* Pre-hydration only; components.css owns typography via tokens (§8). */
      body {
        font-family: 'Roboto Flex', 'Inter', system-ui, sans-serif;
      }
      .material-symbols-rounded {
        font-family: 'Material Symbols Rounded';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings: 'liga';
      }
      /* Escape-hatch family for <Icon variant="outlined"> (§28). */
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined', 'Material Symbols Rounded';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings: 'liga';
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes m3-linear-indeterminate {
        0% { transform: translateX(-100%) scaleX(0.2); }
        50% { transform: translateX(20%) scaleX(0.7); }
        100% { transform: translateX(120%) scaleX(0.2); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/showcase/main.tsx"></script>
  </body>
</html>
